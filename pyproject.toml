[project]
name = "bacscan"
version = "0.1.0"
description = "Read-only BACnet/IP discovery and inventory tool"
readme = "README.md"
authors = [
    { name = "Joerg Seitter", email = "jseitter@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bacpypes3>=0.0.110",
    "openpyxl>=3.1.5",
    "psutil>=7.2.2",
    "pyside6>=6.12.0",
    "rich>=15.0.0",
]

[project.scripts]
bacscan = "bacscan.cli.main:main"
bacscan-gui = "bacscan.gui.app:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
